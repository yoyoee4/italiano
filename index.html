<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="VolaLingo — למד איטלקית! 10,000 מילים, A1-C2, כרטיסיות, תרגול, הקראה">
<meta name="keywords" content="learn Italian, Italian language app, Italian vocabulary, למידת איטלקית, אפליקציה איטלקית">
<link rel="canonical" href="https://italiano.tickerio.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="VolaLingo — למד איטלקית 🇮🇹">
<meta property="og:description" content="10,000 מילים! מסלול A1→C2, כרטיסיות, תרגול, הקראה וסימולציות.">
<meta property="og:image" content="https://italiano.tickerio.app/icon-512.png">
<meta property="og:url" content="https://italiano.tickerio.app/">
<title>VolaLingo v4 — למד איטלקית 🇮🇹</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v4.css">
</head>
<body>

<!-- ═══ SPLASH ═══ -->
<div id="splash">
  <div class="splash-content">
    <div class="splash-icon">🇮🇹</div>
    <div class="splash-brand">Vola<span>Lingo</span></div>
    <div class="splash-tagline">ללמוד איטלקית — 10,000 מילים!</div>
    <div class="splash-bar-wrap">
      <div class="splash-bar" id="splashBar"></div>
    </div>
  </div>
</div>

<!-- ═══ ONBOARDING ═══ -->
<div id="onboarding" style="display:none">
  <div class="onb-content">
    <div class="onb-logo">🇮🇹</div>
    <div class="onb-brand">Vola<span>Lingo</span></div>
    <div class="onb-tagline">ללמוד איטלקית כמו אפליקציה!</div>
    <input id="onbName" type="text" placeholder="השם שלך" class="onb-input" dir="rtl" autocomplete="off">
    <div class="onb-level-label">רמת התחלה:</div>
    <div class="onb-levels">
      <button onclick="selectOnbLevel('A1')" class="onb-lvl active" data-level="A1">A1</button>
      <button onclick="selectOnbLevel('A2')" class="onb-lvl" data-level="A2">A2</button>
      <button onclick="selectOnbLevel('B1')" class="onb-lvl" data-level="B1">B1</button>
      <button onclick="selectOnbLevel('B2')" class="onb-lvl" data-level="B2">B2</button>
      <button onclick="selectOnbLevel('C1')" class="onb-lvl" data-level="C1">C1</button>
      <button onclick="selectOnbLevel('C2')" class="onb-lvl" data-level="C2">C2</button>
    </div>
    <button onclick="finishOnboarding()" class="onb-start-btn">בוא נתחיל! 🚀</button>
  </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="app" style="display:none">
  <!-- TOP BAR -->
  <header id="topBar" class="top-bar"></header>

  <!-- SCROLLABLE CONTENT -->
  <div id="pageContainer" class="page-container"></div>

  <!-- BOTTOM NAV -->
  <nav id="bottomNav" class="bottom-nav"></nav>
</div>

<!-- ═══ CONFETTI CANVAS ═══ -->
<canvas id="confettiCanvas" style="display:none"></canvas>

<script src="js/data_v3.js"></script>
<script src="js/data_v4_additions.js"></script>
<script src="js/v4.js"></script>
</body>
</html>
