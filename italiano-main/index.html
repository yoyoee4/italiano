<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="VolaLingo — למד איטלקית כמו אפליקציה! מסלול A1→B1, משפטים, דקדוק, משחקים ועוד">
<title>VolaLingo — למד איטלקית 🇮🇹</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>

<!-- ═══ SPLASH ═══ -->
<div id="splash" class="onboard-screen" style="position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center">
 <div style="text-align:center">
  <div class="onboard-emoji" style="animation:heartbeat 1.5s infinite">🇮🇹</div>
  <div style="font-family:var(--font-he);font-size:2.2rem;font-weight:900;letter-spacing:-2px;color:var(--text)">Vola<span style="color:var(--primary)">Lingo</span></div>
  <div style="color:var(--text2);font-size:.85rem;margin-top:4px">האפליקציה המובילה ללימוד איטלקית!</div>
  <div class="progress-bar" style="width:60%;margin:20px auto 0;height:4px"><div class="progress-fill" id="splashBar" style="width:0%;transition:width 1.5s ease"></div></div>
 </div>
</div>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen" class="onboard-screen page" style="display:none;min-height:100vh;padding-top:20vh">
 <div style="text-align:center;margin-bottom:32px">
  <div class="onboard-emoji">🇮🇹</div>
  <div class="onboard-title" style="font-family:var(--font-it)">Vola<span style="color:var(--primary)">Lingo</span></div>
  <div class="onboard-sub">ללמוד איטלקית כמו אפליקציה!</div>
 </div>
 <div style="max-width:360px;margin:0 auto">
  <div class="card" style="padding:20px;margin-bottom:16px">
   <input type="text" id="loginName" placeholder="שם (או כינוי)" autocomplete="off" maxlength="20" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:.95rem;font-family:var(--font-he);outline:none;margin-bottom:12px">
   <select id="loginLevel" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:.95rem;font-family:var(--font-he);outline:none;appearance:none">
    <option value="">רמה נוכחית...</option>
    <option value="A1">A1 — מתחילים 🌱</option>
    <option value="A2">A2 — בסיסי 🌿</option>
    <option value="B1">B1 — בינוני 🌳</option>
    <option value="B2">B2 — עצמאי 🏛️</option>
    <option value="C1">C1 — מתקדם 🎓</option>
   </select>
  </div>
  <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">🚀 התחל ללמוד!</button>
  <div style="text-align:center;margin-top:16px;font-size:.7rem;color:var(--text3)">הפרופיל נשמר מקומית — ללא רישום</div>
 </div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="appScreen" style="display:none">

 <!-- PAGE CONTENT -->
 <div id="pageContent" class="page active" style="padding:0 16px 80px;max-width:600px;margin:0 auto">
 <!-- Dynamic content injected by JS -->
 </div>

 <!-- BOTTOM NAV — Tickerio Style -->

    <div class="bottom-nav scrollable">
      <div class="nav-item active" data-page="learn" onclick="nav('learn')"><span class="emoji">🗺️</span>למידה</div>
      <div class="nav-item" data-page="stories" onclick="nav('stories')"><span class="emoji">📖</span>סיפורים</div>
      <div class="nav-item" data-page="sentbuild" onclick="nav('sentbuild')"><span class="emoji">🧩</span>משפטים</div>
      <div class="nav-item" data-page="grammar" onclick="nav('grammar')"><span class="emoji">📚</span>דקדוק</div>
      <div class="nav-item" data-page="league" onclick="nav('league')"><span class="emoji">🏆</span>ליגה</div>
      <div class="nav-item" data-page="practice" onclick="nav('practice')"><span class="emoji">🎯</span>תרגול</div>
      <div class="nav-item" data-page="trainer" onclick="nav('trainer')"><span class="emoji">🏋️</span>מאמן</div>
      <div class="nav-item" data-page="shop" onclick="nav('shop')"><span class="emoji">🛒</span>חנות</div>
      <div class="nav-item" data-page="profile" onclick="nav('profile')"><span class="emoji">👤</span>פרופיל</div>
      <div class="nav-item" data-page="exams" onclick="nav('exams')"><span class="emoji">📝</span>מבחנים</div>
    </div>
 </div>
</div>

<!-- ═══ TOAST ═══ -->
<div id="toast" style="position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none"></div>

<!-- ═══ CONFETTI CANVAS ═══ -->
<canvas id="confettiCanvas" style="position:fixed;inset:0;z-index:250;pointer-events:none"></canvas>

<!-- ═══ SCRIPTS ═══ -->
<script src="js/core/content-loader.js"></script>
<script src="js/core/events.js"></script>
<script src="js/modules/coach.js"></script>
<script src="js/modules/gamification.js"></script>
<script src="js/modules/exam.js"></script>
<!-- Practice Core Modules (Sprint C4A) -->
<script src="js/modules/practice/practice-core.js"></script>
<script src="js/modules/practice/exercises.js"></script>
<script src="js/modules/practice/anki-practice.js"></script>
<script src="js/modules/practice/dialogue-practice.js"></script>
<script src="js/modules/practice/practice-ui.js"></script>
<script src="js/modules/practice/index.js"></script>
<!-- Exercise Registry & Generators (Sprint C4C) -->
<script src="js/modules/practice/exercise-registry.js"></script>
<script src="js/modules/practice/generators/index.js"></script>
<script src="js/modules/practice/content-exercises.js"></script>
<!-- Learning Orchestrator (Sprint C4D) -->
<script src="js/modules/orchestrator.js"></script>
<script src="js/app.js"></script>
<script src="js/skill-tree.js"></script>
<script src="js/content.js"></script>
<script src="js/features.js"></script>
<script src="js/games.js"></script>
<script src="js/speak.js"></script>
<script src="js/sentbuild.js"></script>
<script src="js/listening.js"></script>
<script src="js/trainer.js"></script>
<script src="js/stories.js"></script>
<script src="js/bottom-nav.js"></script>
<script>
// Override explore page to use Features module
const _origGoPage = goPage;
goPage = function(page) {
 _origGoPage(page);
    if (page === 'explore') {
     setTimeout(() => Features.renderExploreTab(document.getElementById('exploreContent')), 50);
    }
    // Nona page change handler — resetNagTimer only (app.js handles onPageChange)
    if (typeof Nona !== 'undefined') {
      Nona.resetNagTimer();
    }
};
// Init features
Features.init();
// Nona.init() is called from app.js showApp()
</script>

</body>
</html>
